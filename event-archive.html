
<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="icon" type="image/png" href="favicon-sito.png">
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EVENT ARCHIVE | QUERCIA</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Helvetica+Neue:wght@400;700&display=swap');
    @import url('https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Courier Prime', monospace;
      background: #fff;
      color: #000;
      padding: 40px 14px 60px;
      max-width: 620px;
      margin: auto;
    }

    /* ===== Header (same style as the MENU button on the home) ===== */
    .page-header {
      text-align: center;
      margin-bottom: 2rem;
    }

    h1 {
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      font-size: 1.2rem;
      font-weight: 700;
      text-transform: uppercase;
      color: #000;
    }

    .subtitle {
      margin-top: 0.8rem;
      font-size: clamp(0.7rem, 3vw, 0.8rem);
    }

    /* ===== Cards (same style as the event box on the home) ===== */
    .archive-column {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .event-card {
      background: #f5f5f5;
      border: 1px solid #000;
      padding: clamp(0.8rem, 3vw, 1.1rem);
      min-height: clamp(96px, 24vw, 120px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: clamp(8px, 2.5vw, 12px);
      text-align: center;
      opacity: 0;
      transition: opacity 0.35s ease;
    }

    .event-card.is-visible { opacity: 1; }

    .event-place {
      font-size: clamp(0.85rem, 3.2vw, 1rem);
      line-height: 1.3;
      text-transform: uppercase;
    }

    .event-city {
      font-size: clamp(0.75rem, 2.8vw, 0.85rem);
      line-height: 1.3;
    }

    /* Date = the black RSVP-style button */
    .event-date {
      display: inline-block;
      padding: clamp(0.35rem, 1.6vw, 0.5rem) clamp(0.7rem, 3vw, 1rem);
      border: 1px solid #000;
      background: #000;
      color: #fff;
      font-family: 'Courier Prime', monospace;
      font-size: clamp(0.72rem, 2.8vw, 0.9rem);
      font-weight: 700;
      cursor: pointer;
      -webkit-appearance: none;
      appearance: none;
      -webkit-tap-highlight-color: transparent;
    }

    .event-date:hover {
      background: #fff;
      color: #000;
    }

    .event-date:focus-visible,
    .close-btn:focus-visible,
    .back-link:focus-visible {
      outline: 2px solid #000;
      outline-offset: 3px;
    }

    /* ===== Flyer modal ===== */
    .modal {
      position: fixed;
      inset: 0;
      background: rgba(255,255,255,0.75);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
      z-index: 9999;
      overflow: hidden;
    }

    .modal.open {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-window {
      position: fixed;
      left: 50%;
      top: 50%;
      width: min(92vw, 480px);
      max-height: 88vh;
      display: flex;
      flex-direction: column;
      background: #f5f5f5;
      border: 1px solid #000;
      transform: translate(-50%, -50%);
    }

    .modal-window.is-dragged { transform: none; }

    .window-bar {
      display: flex;
      align-items: stretch;
      justify-content: space-between;
      background: #000;
      color: #fff;
      cursor: grab;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      flex-shrink: 0;
    }

    .window-bar.dragging { cursor: grabbing; }

    .window-title {
      padding: 0.55rem 0.8rem;
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .close-btn {
      padding: 0 0.9rem;
      border: none;
      border-left: 1px solid #fff;
      background: #000;
      color: #fff;
      font-family: 'Courier Prime', monospace;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      -webkit-appearance: none;
      appearance: none;
    }

    .close-btn:hover {
      background: #fff;
      color: #000;
    }

    .modal-content {
      padding: 14px;
      overflow-y: auto;
    }

    .modal-meta {
      text-align: center;
      margin-bottom: 12px;
    }

    .modal-event-date {
      font-weight: 700;
      font-size: 0.95rem;
      margin-bottom: 2px;
    }

    .modal-event-place {
      font-size: 0.8rem;
      text-transform: uppercase;
    }

    .flyer-frame {
      border: 1px solid #000;
      background: #fff;
      min-height: 240px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .flyer-image {
      display: block;
      width: 100%;
      height: auto;
      max-height: 65vh;
      object-fit: contain;
    }

    .flyer-placeholder {
      padding: 40px 20px;
      text-align: center;
      font-size: 0.8rem;
    }

    /* ===== Back link (same as home footer links) ===== */
    .back-link {
      display: block;
      width: max-content;
      margin: 2rem auto 0;
      font-size: 0.75rem;
      color: #000;
      text-decoration: none;
    }

    .back-link:hover { text-decoration: underline; }

    @media (prefers-reduced-motion: reduce) {
      .event-card, .modal { transition: none; }
    }
  </style>
</head>
<body>

<header class="page-header">
  <h1>Event Archive</h1>
</header>

<div class="archive-column" id="archive"></div>

<a href="index.html" class="back-link">← back to home</a>

<div class="modal" id="modal" aria-hidden="true">
  <div class="modal-window" id="modal-window" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="window-bar" id="window-bar">
      <div class="window-title">Flyer</div>
      <button class="close-btn" id="close-modal" aria-label="Close flyer">X</button>
    </div>

    <div class="modal-content">
      <div class="modal-meta">
        <div class="modal-event-date" id="modal-title"></div>
        <div class="modal-event-place" id="modal-place"></div>
      </div>

      <div class="flyer-frame">
        <div class="flyer-placeholder" id="flyer-placeholder">Flyer coming soon</div>
        <img id="flyer-image" class="flyer-image" src="" alt="" style="display:none;">
      </div>
    </div>
  </div>
</div>

<script>
/* ===== EVENTS =====
   Format: ["date", "venue", "city", "flyer image path (optional)"]
   Example flyer: "flyers/satori.jpg"                                  */
const events = [
  ["19.09.2026","Satori","Giovinazzo",""],
  ["15.08.2026","MV :)","",""],
  ["11.08.2026","Pineta","Porto Rotondo",""],
  ["08.08.2026","Surf","Porto Pollo",""],
  ["10.07.2026","Grandangolo","Roma",""],
  ["04.07.2026","Forte Antenne","Roma",""],
  ["07.06.2026","Balagan","Roma",""],
  ["23.05.2026","Grandangolo","Roma",""],
  ["08.05.2026","Balagan","Roma",""],
  ["20.03.2026","Balagan","Roma",""],
  ["07.03.2026","Apophis Club","Milano",""],
  ["06.02.2026","Balagan","Roma",""],
  ["12.12.2025","Club Industria","Roma",""],
  ["15.11.2025","Club Industria","Roma",""],
  ["17.10.2025","Club Industria","Roma",""],
  ["20.09.2025","Grandangolo","Roma",""],
  ["15.08.2025","MV :)","",""],
  ["10.08.2025","Surf","Porto Pollo",""],
  ["09.08.2025","Kuta","Porto Rotondo",""],
  ["27.06.2025","Forte Trionfale","Roma",""],
  ["11.05.2025","The Sanctuary","Roma",""],
  ["19.04.2025","Lanificio","Roma",""],
  ["30.03.2025","The Sanctuary","Roma",""],
  ["02.03.2025","The Sanctuary","Roma",""],
  ["21.02.2025","Club Industria","Roma",""],
  ["19.12.2024","Proj3ct Store","Roma",""],
  ["15.11.2024","La Villa","Roma",""],
  ["05.10.2024","Notorious Club","Roma",""],
  ["07.07.2024","Cave di Tufo","Roma",""],
  ["02.06.2024","Terrazza C1bo","Roma",""],
  ["12.05.2024","Coconut Bar","Roma",""]
];

const container = document.getElementById("archive");
const modal = document.getElementById("modal");
const modalWindow = document.getElementById("modal-window");
const windowBar = document.getElementById("window-bar");
const modalTitle = document.getElementById("modal-title");
const modalPlace = document.getElementById("modal-place");
const flyerImage = document.getElementById("flyer-image");
const flyerPlaceholder = document.getElementById("flyer-placeholder");
const closeModalBtn = document.getElementById("close-modal");

/* ===== BUILD CARDS ===== */
events.forEach((e, i) => {
  const [date, place, city] = e;
  const card = document.createElement("div");
  card.className = "event-card";

  const placeEl = document.createElement("p");
  placeEl.className = "event-place";
  placeEl.textContent = place;
  card.appendChild(placeEl);

  if (city) {
    const cityEl = document.createElement("p");
    cityEl.className = "event-city";
    cityEl.textContent = city;
    card.appendChild(cityEl);
  }

  const dateBtn = document.createElement("button");
  dateBtn.className = "event-date";
  dateBtn.textContent = date;
  dateBtn.addEventListener("click", () => openModal(e));
  card.appendChild(dateBtn);

  container.appendChild(card);
  setTimeout(() => card.classList.add("is-visible"), i * 40);
});

/* ===== MODAL ===== */
function resetWindowPosition() {
  modalWindow.classList.remove("is-dragged");
  modalWindow.style.left = "50%";
  modalWindow.style.top = "50%";
}

function openModal(eventData) {
  const [date, place, city, flyer] = eventData;

  modalTitle.textContent = date;
  modalPlace.textContent = city ? `${place} — ${city}` : place;

  if (flyer && flyer.trim() !== "") {
    flyerImage.src = flyer;
    flyerImage.alt = `${date} ${place}`;
    flyerImage.style.display = "block";
    flyerPlaceholder.style.display = "none";
  } else {
    flyerImage.src = "";
    flyerImage.style.display = "none";
    flyerPlaceholder.style.display = "block";
  }

  resetWindowPosition();
  modal.classList.add("open");
  modal.setAttribute("aria-hidden", "false");
  closeModalBtn.focus();
}

function closeModal() {
  modal.classList.remove("open");
  modal.setAttribute("aria-hidden", "true");
}

closeModalBtn.addEventListener("click", closeModal);
modal.addEventListener("click", (e) => { if (e.target === modal) closeModal(); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeModal(); });

/* ===== DRAG THE WINDOW BY ITS BLACK BAR ===== */
let isDragging = false;
let currentPointerId = null;
let offX = 0, offY = 0;

windowBar.addEventListener("pointerdown", (e) => {
  if (e.target === closeModalBtn) return;
  const rect = modalWindow.getBoundingClientRect();
  modalWindow.classList.add("is-dragged");
  modalWindow.style.left = rect.left + "px";
  modalWindow.style.top = rect.top + "px";
  offX = e.clientX - rect.left;
  offY = e.clientY - rect.top;
  isDragging = true;
  currentPointerId = e.pointerId;
  windowBar.setPointerCapture(e.pointerId);
  windowBar.classList.add("dragging");
});

windowBar.addEventListener("pointermove", (e) => {
  if (!isDragging || e.pointerId !== currentPointerId) return;
  const rect = modalWindow.getBoundingClientRect();
  const maxLeft = Math.max(0, window.innerWidth - rect.width);
  const maxTop = Math.max(0, window.innerHeight - rect.height);
  modalWindow.style.left = Math.max(0, Math.min(e.clientX - offX, maxLeft)) + "px";
  modalWindow.style.top = Math.max(0, Math.min(e.clientY - offY, maxTop)) + "px";
});

function endDrag() {
  isDragging = false;
  currentPointerId = null;
  windowBar.classList.remove("dragging");
}
windowBar.addEventListener("pointerup", endDrag);
windowBar.addEventListener("pointercancel", endDrag);
windowBar.addEventListener("lostpointercapture", endDrag);

window.addEventListener("resize", () => {
  if (!modal.classList.contains("open") || !modalWindow.classList.contains("is-dragged")) return;
  const rect = modalWindow.getBoundingClientRect();
  const maxLeft = Math.max(0, window.innerWidth - rect.width);
  const maxTop = Math.max(0, window.innerHeight - rect.height);
  modalWindow.style.left = Math.max(0, Math.min(rect.left, maxLeft)) + "px";
  modalWindow.style.top = Math.max(0, Math.min(rect.top, maxTop)) + "px";
});
</script>

</body>
</html>
