  <style>
    @import url('https://fonts.googleapis.com/css2?family=Helvetica+Neue:wght@400;700&display=swap');
    @import url('https://fonts.googleapis.com/css2?family=Courier+Prime&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; }
    body {
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      background-color: #fff;
      color: #000;
      position: relative;
    }

    /* ===== Scattered draggable letters ===== */
    #letters-layer {
      position: fixed;
      inset: 0;
      z-index: 9999;
      pointer-events: none; /* layer transparent to clicks; letters re-enable */
    }
    .letter {
      position: absolute;
      top: 0;
      left: 0;
      /* Height defines the size; width follows the glyph aspect ratio.
         ~1/7 of the original logo footprint, responsive. */
      height: clamp(34px, 9vw, 68px);
      cursor: grab;
      touch-action: none;
      pointer-events: auto;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      will-change: transform;
    }
    .letter svg {
      display: block;
      height: 100%;
      width: auto;
      pointer-events: none; /* dragging handled on wrapper */
    }
    .letter svg path { fill: #000; }
    .letter.dragging { cursor: grabbing; }

    .menu-container {
      position: absolute;
      top: 30%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      z-index: 1000;
    }
    #menu-toggle {
      padding: 0.75rem 1.5rem;
      font-size: 1rem;
      border: 1px solid #000;
      background: none;
      cursor: pointer;
      font-weight: 700;
      text-transform: uppercase;
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      color: #000;
      -webkit-appearance: none;
      appearance: none;
      -webkit-tap-highlight-color: transparent;
    }
    #menu-toggle.open,
    #menu-toggle:hover {
      background-color: #000;
      color: #fff;
    }
    #menu-toggle:focus,
    #menu-toggle:active {
      outline: none;
    }
    #menu-dropdown {
      display: none;
      position: absolute;
      top: 100%; left: 0;
      width: 100%;
      background: transparent;
      border: none;
      box-shadow: none;
      list-style: none;
      padding: 0.5rem 0;
      text-align: center;
      z-index: 1001;
    }
    #menu-dropdown li a,
    #menu-dropdown li a:visited {
      display: block;
      padding: 0.45rem 1rem;
      text-decoration: none;
      color: #000;
      font-family: 'Courier Prime', monospace;
      font-size: 0.8rem;
    }
    #menu-dropdown li a:hover {
      background: #000;
      color: #fff;
    }

    /* Wrapper: keeps the pair of event boxes centered on the page */
    .events-wrap {
      position: absolute;
      top: 70%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 500;
      display: flex;
      justify-content: center;
      align-items: stretch;      /* equal height boxes */
      gap: clamp(0.4rem, 2vw, 1rem);
      width: min(94vw, 720px);
    }

    .event-box {
      flex: 1 1 0;               /* equal widths, shrink to fit */
      min-width: 0;              /* allows shrinking below content width */
      max-width: 340px;
      background: #f5f5f5;
      border: 1px solid #000;
      padding: clamp(0.55rem, 2.2vw, 1rem);
      text-align: center;
      font-family: 'Courier Prime', monospace;
      min-height: clamp(115px, 26vw, 140px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      overflow-wrap: break-word;
    }
    .event-box p {
      margin: 0.2rem 0;
      font-size: clamp(0.68rem, 3vw, 1rem);
      line-height: 1.3;
      width: 100%;
    }
    .event-box .spacer { height: clamp(8px, 2vw, 15px); }

    .event-button {
      display: inline-block;
      padding: clamp(0.35rem, 1.6vw, 0.5rem) clamp(0.6rem, 3vw, 1rem);
      border: 1px solid #000;
      background: #000;
      color: #fff;
      text-decoration: none;
      font-family: 'Courier Prime', monospace;
      font-size: clamp(0.62rem, 2.8vw, 0.9rem);
      font-weight: bold;
      cursor: pointer;
      white-space: nowrap;
    }
    .event-button.disabled {
      background: #ccc;
      color: #666;
      border: 1px solid #999;
      cursor: default;
    }

    .subtitle {
      position: absolute;
      bottom: 5%; left: 50%;
      transform: translateX(-50%);
      font-family: 'Courier Prime', monospace;
      font-size: clamp(0.42rem, 3vw, 0.7rem);
      text-align: center;
      padding: 0 1rem;
      width: max-content;
      max-width: 100%;
      box-sizing: border-box;
      white-space: nowrap;
      line-height: 1.4;
      z-index: 100;
    }

    .subtitle a {
      color: #000;
      text-decoration: none;
    }
    .subtitle a:hover {
      text-decoration: underline;
    }
  </style>

    const layer = document.getElementById('letters-layer');

    // Each letter tracks its own position (x,y = top-left in px) and a
    // slow independent drift velocity. Dragging overrides drift; on release
    // drift resumes.
    const nodes = [];

    function rand(min, max) { return Math.random() * (max - min) + min; }

    function buildLetter(def) {
      const el = document.createElement('div');
      el.className = 'letter';
      el.innerHTML = '<svg viewBox="' + def.vb + '" xmlns="http://www.w3.org/2000/svg"><path d="' + def.d + '"/></svg>';
      layer.appendChild(el);

      const state = {
        el,
        seq: nodes.length, // spelling position (0=Q ... 6=A)
        x: 0, y: 0,
        vx: 0, vy: 0,
        rot: 0,
        w: 0, h: 0,
        dragging: false,
        dragOffX: 0, dragOffY: 0,
        pointerId: null
      };
      nodes.push(state);
      return state;
    }

    // Place all letters at random positions fully on-screen (no letter
    // starts off the visible area). Called on load and on resize-respawn.
    function scatter() {
      const vw = window.innerWidth;
      const vh = window.innerHeight;

      // Measure each letter first so we can lay out a centered word.
      nodes.forEach(s => {
        const r = s.el.getBoundingClientRect();
        s.w = r.width;
        s.h = r.height;
      });

      // Order letters by spelling position (Q..A), left to right.
      const spelled = nodes.slice().sort((a, b) => a.seq - b.seq);

      // Gap between adjacent letters (a bit of air, scales down on mobile).
      const gap = Math.min(vw * 0.018, 14);
      const totalW = spelled.reduce((sum, s) => sum + s.w, 0) + gap * (spelled.length - 1);

      // Baseline row position: centered horizontally, at the old logo height.
      let penX = (vw - totalW) / 2;
      const baseY = vh * 0.15;

      // Jitter magnitudes for the "readable disorder" look.
      const jitterX = Math.min(vw * 0.012, 10);
      const jitterY = Math.min(vh * 0.05, 42);

      spelled.forEach(s => {
        let x = penX + rand(-jitterX, jitterX);
        let y = baseY - s.h / 2 + rand(-jitterY, jitterY);
        // clamp so every letter still starts fully on-screen
        s.x = Math.max(0, Math.min(x, vw - s.w));
        s.y = Math.max(0, Math.min(y, vh - s.h));
        penX += s.w + gap;
        // random tilt angle, fixed for the letter's lifetime this session
        s.rot = rand(-30, 30);
        // slow independent drift (px per frame at 60fps)
        const speed = rand(0.12, 0.35);
        const angle = rand(0, Math.PI * 2);
        s.vx = Math.cos(angle) * speed;
        s.vy = Math.sin(angle) * speed;
        applyTransform(s);
      });
    }

    function applyTransform(s) {
      s.el.style.transform = 'translate(' + s.x + 'px,' + s.y + 'px) rotate(' + s.rot + 'deg)';
    }

    // ---- Drift animation loop ----
    // Letters gently float; they bounce softly off viewport edges so the
    // set stays roughly on-screen, but the user can still drag them off.
    function tick() {
      const vw = window.innerWidth;
      const vh = window.innerHeight;
      for (const s of nodes) {
        if (s.dragging) continue;
        s.x += s.vx;
        s.y += s.vy;
        // soft edge bounce (only while drifting, not while dragged)
        if (s.x <= 0) { s.x = 0; s.vx = Math.abs(s.vx); }
        else if (s.x >= vw - s.w) { s.x = vw - s.w; s.vx = -Math.abs(s.vx); }
        if (s.y <= 0) { s.y = 0; s.vy = Math.abs(s.vy); }
        else if (s.y >= vh - s.h) { s.y = vh - s.h; s.vy = -Math.abs(s.vy); }
        applyTransform(s);
      }
      requestAnimationFrame(tick);
    }

    // ---- Dragging (pointer events: mouse + touch) ----
    function attachDrag(s) {
      s.el.addEventListener('pointerdown', e => {
        e.preventDefault();
        s.dragging = true;
        s.pointerId = e.pointerId;
        s.el.setPointerCapture(e.pointerId);
        s.el.classList.add('dragging');
        // bring the grabbed letter above the others
        s.el.style.zIndex = String(Date.now() % 100000);
        s.dragOffX = e.clientX - s.x;
        s.dragOffY = e.clientY - s.y;
      });

      s.el.addEventListener('pointermove', e => {
        if (!s.dragging || e.pointerId !== s.pointerId) return;
        s.x = e.clientX - s.dragOffX;
        s.y = e.clientY - s.dragOffY;   // no clamping: can go off-screen
        applyTransform(s);
      });

      function endDrag(e) {
        if (!s.dragging || (s.pointerId !== null && e.pointerId !== s.pointerId)) return;
        s.dragging = false;
        s.pointerId = null;
        s.el.classList.remove('dragging');
        try { s.el.releasePointerCapture(e.pointerId); } catch (err) {}
        // resume drift with a fresh random slow direction
        const speed = rand(0.12, 0.35);
        const angle = rand(0, Math.PI * 2);
        s.vx = Math.cos(angle) * speed;
        s.vy = Math.sin(angle) * speed;
      }
      s.el.addEventListener('pointerup', endDrag);
      s.el.addEventListener('pointercancel', endDrag);
    }

    // ---- Init ----
    // Build in spelling order (Q,U,E,R,C,I,A) so the initial layout is a
    // readable word; the random tilt + drift supply the "disorder".
    LETTERS.forEach(def => {
      const s = buildLetter(def);
      attachDrag(s);
    });

    // Wait a frame so getBoundingClientRect has real sizes, then scatter.
    requestAnimationFrame(() => {
      scatter();
      requestAnimationFrame(tick);
    });

    // Keep letters sensible on resize: re-clamp any that are now fully
    // off-screen back to a random on-screen spot (dragged-away ones that
    // are still partly visible are left alone).
    let resizeTimer = null;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => {
        const vw = window.innerWidth;
        const vh = window.innerHeight;
        nodes.forEach(s => {
          const fullyOff = (s.x + s.w < 0) || (s.x > vw) || (s.y + s.h < 0) || (s.y > vh);
          if (fullyOff) {
            s.x = rand(0, Math.max(0, vw - s.w));
            s.y = rand(0, Math.max(0, vh - s.h));
            applyTransform(s);
          }
        });
      }, 150);
    });

    /* ============================================================
       MENU + EVENT BOX (unchanged)

    const menuToggle = document.getElementById('menu-toggle');
    const dropdown = document.getElementById('menu-dropdown');

    menuToggle.addEventListener('click', e => {
      e.stopPropagation();
      const open = dropdown.style.display === 'block';
      dropdown.style.display = open ? 'none' : 'block';
      menuToggle.classList.toggle('open', !open);
    });

    document.addEventListener('click', () => {
      dropdown.style.display = 'none';
      menuToggle.classList.remove('open');
    });

    // ===== EVENT CONFIG =====
    // Add / remove objects here — the boxes are generated automatically
    // and stay centered as a group.
    const EVENTS = [

        buttonText: "TICKETS",
        link: "https://xceed.me/en/porto-rotondo/event/quercia-caos-open-air/238723/channel/quercia-1"
      },
      {
        date: "08.08.2026",
        location: "SURF Porto Pollo",
        buttonText: "RSVP",
        link: "https://luma.com/w1grdkkb"            
      }
    ];

    const eventsWrap = document.getElementById("events-wrap");

    EVENTS.forEach(ev => {
      const box = document.createElement("div");
      box.className = "event-box";

      const date = document.createElement("p");
      date.className = "event-date";
      date.textContent = ev.date;

      const loc = document.createElement("p");
      loc.className = "event-location";
      loc.textContent = ev.location;

      const spacer = document.createElement("div");
      spacer.className = "spacer";

      const btn = document.createElement("a");
      btn.className = "event-button";
      btn.textContent = ev.buttonText;

      // ===== BUTTON BEHAVIOR =====
      if (!ev.link || ev.buttonText === "SOON") {
        btn.classList.add("disabled");
      } else {
        btn.href = ev.link;
        btn.target = "_blank";
        btn.rel = "noopener";
      }

      box.append(date, loc, spacer, btn);
      eventsWrap.appendChild(box);
    });
  </script>
